[project]
name = "hark"
version = "0.1.0"
description = "Local live meeting transcript with speaker labels, streamed to a file any agent can follow"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # SpeakerStreamingSession and Nemotron diarization use this pinned MLX build.
    "mlx-audio[stt] @ git+https://github.com/Blaizzy/mlx-audio@4ab7e6f7dedd69a136cfaa318c5dc8aed5119446 ; sys_platform == 'darwin'",
    "numpy>=1.26",
    "sounddevice>=0.5.1 ; sys_platform == 'darwin'",
    "websockets>=15,<17",
    "huggingface-hub>=0.34",
    "soundfile>=0.13",
    "scipy>=1.13",
    "onnxruntime>=1.22.1,<1.23",
]

[dependency-groups]
dev = ["pytest>=8.4.2,<9"]

[project.scripts]
hark = "hark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
